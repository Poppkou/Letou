plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.kvartaly.game'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.kvartaly.game'
        minSdk 26
        targetSdk 35
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ? System.getenv('GITHUB_RUN_NUMBER').toInteger() : 1)
        versionName '1.0.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    // Общий ключ из репозитория — чтобы новые версии ставились поверх старых без удаления.
    signingConfigs {
        shared {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.shared }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    // Игра (HTML/JS) лежит в ../../www и целиком кладётся в assets
    sourceSets {
        main { assets.srcDirs = ['../../www'] }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
