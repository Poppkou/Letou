<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#121216">
<title>Кварталы</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div id="hudtl">
    <div class="bar"><div id="hpbar"></div><span id="hptext"></span></div>
    <div class="bar xp"><div id="xpbar"></div></div>
    <div class="row"><span id="money"></span><span id="floorlbl"></span><span id="pt"></span><span id="danger"></span></div>
  </div>
  <div id="missionbox"><div id="missionlist"></div></div>
  <div id="hudtr">
    <button id="btnPause">⏸</button>
    <div id="minimapwrap"><canvas id="minimap"></canvas></div>
  </div>
  <div id="toast"></div>
</div>

<div id="controls" class="hidden">
  <div id="zoneL" class="zone"></div>
  <div id="zoneR" class="zone"></div>
  <div id="stickL" class="stick"><div id="knobL" class="knob"></div></div>
  <div id="stickR" class="stick aim"><div id="knobR" class="knob"></div></div>
  <div id="btns">
    <button id="wpn"></button>
    <button id="btnTrait" class="rb hidden">⭐</button>
    <button id="btnBag" class="rb">🎒</button>
    <button id="btnAbility" class="rb ab"><span>✦</span><span class="lbl"></span></button>
    <button id="btnAction" class="rb act"><span>✋</span><span class="lbl"></span></button>
    <button id="btnAttack" class="rb atk">⚔</button>
  </div>
</div>

<div id="title" class="screen"></div>
<div id="modal" class="hidden"></div>

<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/map.js"></script>
<script src="js/actors.js"></script>
<script src="js/player.js"></script>
<script src="js/game.js"></script>
<script src="js/missions.js"></script>
<script src="js/interact.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
